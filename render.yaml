# ─── SkillMap API — Render Blueprint ─────────────────────────────────────────
# Native Python runtime (no Docker). One-click deploy:
#   Render Dashboard → New → Blueprint → select this repo → fill prompted secrets.
#
# Secrets use `sync: false`: never stored in git — Render prompts you to paste
# them once in the dashboard (or set them under Environment after first sync).

services:
  - type: web
    name: skillmap-api
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /api/health

    # Python deps + Vite build (node/npm are preinstalled on native runtimes;
    # native runtime also ships postgresql-client for psql debugging)
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build

    # Single worker fits the free 512 MB; threads handle concurrent requests;
    # timeout 300s covers uncached /api/prep/generate on 0.1 CPU
    startCommand: gunicorn --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT run:app

    envVars:
      # Match local interpreter (all pinned deps verified on 3.13.0)
      - key: PYTHON_VERSION
        value: "3.13.0"

      # Cookies: cross-origin XHR to Vercel needs Secure; config flips
      # SameSite→None automatically once CORS_ORIGINS is set
      - key: COOKIE_SECURE
        value: "1"

      # Keep the bge-base-en-v1.5 download inside the project dir so it
      # survives restarts within a deploy (re-fetched only on new deploys)
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/src/.fastembed_cache

      # Post-OAuth redirects land on the Vercel SPA (Render serves no frontend)
      - key: GOOGLE_REDIRECT_URI
        value: https://skillmap-api.onrender.com/google/callback

      # ── Paste when prompted (or under Environment after sync) ──────────────
      # Cross-origin frontend origins — REQUIRED, app breaks without these:
      #   https://<your-app>.vercel.app  (+ preview URL, comma-separated)
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # Core secrets
      - key: SECRET_KEY            # exact value from local .env (else sessions die on restart)
        sync: false
      - key: DATABASE_URL          # Neon connection string from local .env
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Mail (Brevo)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # Payments
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Jobs APIs
      - key: USAJOBS_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      - key: APP_ID
        sync: false
      - key: APP_KEY
        sync: false
